[package]
name = "zode-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
jsonwebtoken = "9.3.1"
libc = "0.2.177"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
zeroize = "1.8.1"
zode-protocol = { path = "../protocol" }

[dev-dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3.20.0"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
