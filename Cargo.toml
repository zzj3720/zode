[package]
name = "zode"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aimux-core = "0.2.1"
aimux-providers = "0.2.1"
axum = "0.8.4"
async-stream = "0.3.6"
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
jsonschema = { version = "0.49.7", default-features = false }
libc = "0.2.180"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
ulid = "1.1.3"
url = "2.5.8"
zode-protocol = { path = "protocol" }

[dev-dependencies]
bincode = "1.3.3"
bytes = "1.12.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
zstd = "0.13.3"
