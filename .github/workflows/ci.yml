name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: zode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  locked-build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            server

      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --dir web/e2e exec playwright install --with-deps chromium

      - name: Build and run deterministic E2E gate
        run: ./scripts/ci/verify.sh

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zode-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/ci
            target/test-recordings
            target/web-e2e-playwright
