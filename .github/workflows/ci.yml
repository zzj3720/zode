name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: zode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  locked-build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            server

      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --dir web/e2e exec playwright install --with-deps chromium

      - name: Build and run deterministic E2E gate
        run: ./scripts/ci/verify.sh

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zode-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/ci
            target/web-e2e-playwright

  approved-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact merge revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            server

      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --dir web/e2e exec playwright install --with-deps chromium

      - name: Run complete approved product matrix
        run: ./scripts/ci/verify-approved-product.sh

      - name: Upload approved product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zode-ci-approved-product-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/ci/approved-product-*
            target/web-e2e-playwright

  required-product-gate:
    if: always()
    needs:
      - locked-build-and-e2e
      - approved-product-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require build, shared evidence, and complete product matrix
        env:
          SHARED_RESULT: ${{ needs.locked-build-and-e2e.result }}
          PRODUCT_RESULT: ${{ needs.approved-product-e2e.result }}
        run: |
          printf 'shared_evidence=%s approved_product=%s\n' "$SHARED_RESULT" "$PRODUCT_RESULT"
          test "$SHARED_RESULT" = success
          test "$PRODUCT_RESULT" = success
